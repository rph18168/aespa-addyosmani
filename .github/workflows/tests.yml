name: Tests

on:
  pull_request:
    branches:
      - feature/aespa-daily-digest
  push:
    branches:
      - feature/aespa-daily-digest

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python
        run: python -m compileall -q src tests
